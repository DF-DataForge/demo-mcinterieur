name: Odoo 20.0 install test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          path: addons

      - name: Check out Odoo 20.0
        uses: actions/checkout@v4
        with:
          repository: odoo/odoo
          ref: '20.0'
          path: odoo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: odoo/requirements.txt

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libldap2-dev libsasl2-dev libpq-dev postgresql-client

      - name: Install Odoo requirements
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r odoo/requirements.txt
          # barcode images in reports (ReportLab renderer); the Debian package ships it, pip on Linux does not
          pip install rl-renderPM==4.0.3

      - name: Install mc_interieur with demo data and run its tests
        env:
          PGPASSWORD: odoo
        run: |
          python odoo/odoo-bin \
            --addons-path=odoo/addons,odoo/odoo/addons,addons \
            --db_host=localhost --db_user=odoo --db_password=odoo \
            -d mc_demo -i mc_interieur --with-demo \
            --test-tags=/mc_interieur \
            --stop-after-init --log-level=info 2>&1 | tee install.log
          if grep -E "ERROR|CRITICAL|Traceback" install.log | grep -v "INFO" ; then
            echo "::error::Errors found in the Odoo log"
            exit 1
          fi

      - name: Install without demo data, load demo data afterwards
        env:
          PGPASSWORD: odoo
        run: |
          OPTS="--addons-path=odoo/addons,odoo/odoo/addons,addons --db_host=localhost --db_user=odoo --db_password=odoo"
          python odoo/odoo-bin $OPTS -d mc_late -i mc_interieur --stop-after-init --log-level=warn
          python odoo/odoo-bin shell $OPTS -d mc_late --log-level=warn > late.log 2>&1 <<'EOF' || (cat late.log; exit 1)
          import odoo.modules.loading
          odoo.modules.loading.force_demo(env)
          env.cr.commit()
          project = env.ref('mc_interieur.project_maes_keuken')
          print('LATE_DEMO', project.stage, len(project.part_ids), len(env['mc.cutting.batch'].search([])))
          EOF
          cat late.log | tail -20
          grep -q "LATE_DEMO validation 12 3" late.log

      - name: Demo records present but setup skipped, then upgrade
        env:
          PGPASSWORD: odoo
        run: |
          OPTS="--addons-path=odoo/addons,odoo/odoo/addons,addons --db_host=localhost --db_user=odoo --db_password=odoo"
          python odoo/odoo-bin $OPTS -d mc_upg -i mc_interieur --stop-after-init --log-level=warn
          python odoo/odoo-bin shell $OPTS -d mc_upg --log-level=warn > upg1.log 2>&1 <<'EOF' || (cat upg1.log; exit 1)
          import odoo.modules.loading
          env['ir.config_parameter'].set_bool('mc_interieur.skip_demo_setup', True)
          odoo.modules.loading.force_demo(env)
          env['ir.config_parameter'].set_bool('mc_interieur.skip_demo_setup', False)
          env.cr.commit()
          print('BEFORE_UPGRADE', env.ref('mc_interieur.project_maes_keuken').stage)
          EOF
          cat upg1.log | tail -5
          grep -q "BEFORE_UPGRADE drawing" upg1.log
          python odoo/odoo-bin $OPTS -d mc_upg -u mc_interieur --stop-after-init --log-level=warn
          python odoo/odoo-bin shell $OPTS -d mc_upg --log-level=warn > upg2.log 2>&1 <<'EOF' || (cat upg2.log; exit 1)
          print('AFTER_UPGRADE', env.ref('mc_interieur.project_maes_keuken').stage, env.ref('mc_interieur.project_desmet_bureau').stage)
          EOF
          cat upg2.log | tail -5
          grep -q "AFTER_UPGRADE validation assembly" upg2.log

      - name: Upgrade from 20.0.1.0.0 (fixed intake fields) to the configurable intake
        env:
          PGPASSWORD: odoo
        run: |
          git -C addons fetch --depth 50 origin main
          git -C addons worktree add ../old_addons 5287eba
          OLD="--addons-path=odoo/addons,odoo/odoo/addons,old_addons --db_host=localhost --db_user=odoo --db_password=odoo"
          NEW="--addons-path=odoo/addons,odoo/odoo/addons,addons --db_host=localhost --db_user=odoo --db_password=odoo"
          python odoo/odoo-bin $OLD -d mc_mig -i mc_interieur --with-demo --stop-after-init --log-level=warn
          python odoo/odoo-bin $NEW -d mc_mig -u mc_interieur --stop-after-init --log-level=warn 2>&1 | tee mig.log
          if grep -E "ERROR|CRITICAL|Traceback" mig.log; then exit 1; fi
          python odoo/odoo-bin shell $NEW -d mc_mig --log-level=warn > mig2.log 2>&1 <<'EOF' || (cat mig2.log; exit 1)
          p = env.ref('mc_interieur.project_maes_keuken')
          print('MIGRATED', p.project_type_id.code, p._mc_intake('worktop'), p._mc_intake('space_width'), p.stage)
          EOF
          cat mig2.log | tail -5
          grep -q "MIGRATED kitchen stone 3240 validation" mig2.log

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odoo-install-log
          path: install.log
