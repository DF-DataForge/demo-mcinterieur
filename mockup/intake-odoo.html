<title>Interieurprojecten intake</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: back-office ERP shell — sticky app bar, control panel, then kanban, list or form sheet with chatter beside it */
/* Palette from the client's website: walnut brown #574A36 / #78664A, leaf green #95BA3C / #ABCB5D, warm greys, Open Sans */
:root{
  --bg:#f1efeb; --surface:#ffffff; --surface-2:#f6f5f2; --ink:#2b251c; --muted:#6e6556; --line:#e2ded7; --line-strong:#c8c1b4;
  --accent:#574a36; --accent-ink:#ffffff; --accent-soft:#efebe3; --accent-line:#cbbfa9;
  --bar:#574a36; --bar-ink:#ffffff; --green:#95ba3c; --green-strong:#5f7d1c; --on-green:#ffffff; --green-soft:#eef4dc;
  --ok:#5f7d1c; --ok-soft:#eef4dc; --warn:#9a5d0c; --warn-soft:#fbefd9; --info:#2d5d8a; --info-soft:#e4edf6;
  --scrim:rgba(30,24,18,.45); --shadow:0 1px 2px rgba(40,30,20,.06),0 6px 18px rgba(40,30,20,.07);
  --font:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1a1712; --surface:#231f19; --surface-2:#2b261f; --ink:#ece7de; --muted:#a89f90; --line:#3a342b; --line-strong:#4e463a;
  --accent:#c9b38f; --accent-ink:#1a1712; --accent-soft:#352d22; --accent-line:#6a5a42;
  --bar:#3b3225; --bar-ink:#f3efe7; --green:#abcb5d; --green-strong:#abcb5d; --on-green:#16200a; --green-soft:#2a3317;
  --ok:#abcb5d; --ok-soft:#2a3317; --warn:#e2ab5a; --warn-soft:#3a2c15; --info:#8ab6e0; --info-soft:#1d2c3b;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1a1712; --surface:#231f19; --surface-2:#2b261f; --ink:#ece7de; --muted:#a89f90; --line:#3a342b; --line-strong:#4e463a;
  --accent:#c9b38f; --accent-ink:#1a1712; --accent-soft:#352d22; --accent-line:#6a5a42;
  --bar:#3b3225; --bar-ink:#f3efe7; --green:#abcb5d; --green-strong:#abcb5d; --on-green:#16200a; --green-soft:#2a3317;
  --ok:#abcb5d; --ok-soft:#2a3317; --warn:#e2ab5a; --warn-soft:#3a2c15; --info:#8ab6e0; --info-soft:#1d2c3b;
  --scrim:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}

.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-ink);border-top:3px solid var(--green)}
.topbar .in{display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;min-height:48px;padding-block:6px}
.brand{font-weight:700;letter-spacing:.01em;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand .dot{width:22px;height:22px;border-radius:5px;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-size:11px;font-weight:700}
.menu{display:flex;gap:2px;flex-wrap:wrap;flex:1}
.menu button{background:none;border:0;padding:6px 10px;border-radius:6px;color:inherit;cursor:pointer;opacity:.85}
.menu button[aria-current="page"],.menu button:hover{opacity:1;background:rgba(255,255,255,.14)}
.mock{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.8}
@media (max-width:1180px){.mock{display:none}.menu button{padding:6px 8px}}

.cp{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-block:12px;border-bottom:1px solid var(--line);background:var(--surface)}
.crumb{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:17px;min-width:0}
.crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
.crumb a:hover{text-decoration:underline}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);padding:6px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent-line);background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:3px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

main{padding-block:16px 40px}

/* kanban */
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
.col{flex:0 0 264px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.col h3{margin:2px 4px 10px;font-size:13.5px;display:flex;justify-content:space-between}
.col h3 .n{color:var(--muted);font-weight:500}
.cards{display:flex;flex-direction:column;gap:8px;min-height:30px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 11px;cursor:pointer;text-align:left;width:100%;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.card:hover{border-color:var(--accent-line)}
.card .t{font-weight:600}
.card .s{color:var(--muted);font-size:12.5px;margin-top:-4px}
.card .foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.info{background:var(--info-soft);color:var(--info)}
.av{width:22px;height:22px;border-radius:50%;background:var(--info-soft);color:var(--info);display:inline-grid;place-items:center;font-size:10.5px;font-weight:700}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
.meta{display:flex;gap:10px;align-items:center}
.ico{width:14px;height:14px;vertical-align:-2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* form */
.fhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.status{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.status button{border:0;background:none;padding:5px 11px;font-size:12.5px;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.status button:last-child{border-right:0}
.status button[aria-current="step"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.status button:hover:not([aria-current="step"]){background:var(--surface-2);color:var(--ink)}
.fgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:1080px){.fgrid{grid-template-columns:minmax(0,1fr)}}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);min-width:0}
.smart{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.smart button{flex:1 1 130px;border:0;border-right:1px solid var(--line);background:none;padding:9px 12px;text-align:left;cursor:pointer;display:flex;gap:9px;align-items:center}
.smart button:last-child{border-right:0}
.smart button:hover{background:var(--surface-2)}
.smart b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.smart span{font-size:12px;color:var(--muted)}
.smart .ico{width:20px;height:20px;color:var(--accent)}
.sheet-in{padding:18px 22px 22px}
@media (max-width:560px){.sheet-in{padding:14px}}
.ref{font-family:var(--mono);font-size:12px;color:var(--muted)}
.title{width:100%;border:0;border-bottom:1px solid transparent;font-size:26px;font-weight:700;padding:2px 0 4px;background:none;letter-spacing:-.01em}
.title:hover,.title:focus{border-bottom-color:var(--line-strong);outline:none}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:4px 28px;margin:12px 0 16px}
.hgrid .field{grid-template-columns:110px minmax(0,1fr)}

.intake{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:8px;margin-bottom:16px}
.intake .bar{max-width:260px;min-width:140px;height:7px;background:var(--surface)}
.intake p{margin:0;flex:1 1 280px;font-size:13px}
.intake strong{font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tabs button{border:0;background:none;padding:9px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tabs button .c{font-size:11px;font-family:var(--mono);margin-left:5px;opacity:.8}
.tabs button .c.full{color:var(--ok)}
.panel{padding-top:16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:6px 32px}
@media (max-width:560px){.pgrid{grid-template-columns:minmax(0,1fr)}}
.field{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 12px;align-items:start;padding:7px 0;border-bottom:1px dashed var(--line)}
.field>label{padding-top:6px;color:var(--muted);font-weight:500}
.field.is-filled>label{color:var(--ink)}
@media (max-width:560px){.field{grid-template-columns:minmax(0,1fr)}.field>label{padding-top:0}}
.ctl{display:flex;gap:6px;align-items:flex-start;min-width:0}
.ctl>:first-child{flex:1;min-width:0}
.inp{width:100%;border:0;border-bottom:1px solid var(--line-strong);background:none;padding:5px 2px;border-radius:0}
.inp:focus{outline:none;border-bottom-color:var(--accent)}
select.inp{cursor:pointer}
textarea.inp{border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;min-height:70px;resize:vertical}
.dims{display:flex;gap:6px;align-items:center}
.dims input{width:100%;min-width:0;text-align:right;font-family:var(--mono);font-size:13px}
.dims span{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px}
.chip:hover{border-color:var(--accent-line)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.flag{flex:0 0 auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer;font-weight:700;font-size:12px}
.flag:hover{border-color:var(--warn);color:var(--warn)}
.flag.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.hint{font-size:12.5px;color:var(--muted);margin:0 0 12px}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.ph{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.ph .img{aspect-ratio:4/3;max-width:100%;background:var(--line);display:grid;place-items:center;overflow:hidden}
.ph .img img,.ph .img svg{width:100%;height:100%;object-fit:cover;display:block}
.ph input{border:0;border-top:1px solid var(--line);background:var(--surface);padding:6px 8px;font-size:12.5px;width:100%}
.ph .file{font-family:var(--mono);font-size:12px;color:var(--muted);padding:10px;text-align:center;word-break:break-all}
.upl{border:1.5px dashed var(--line-strong);border-radius:8px;display:grid;place-items:center;aspect-ratio:4/3;cursor:pointer;color:var(--muted);text-align:center;padding:10px;gap:4px}
.upl:hover{border-color:var(--accent);color:var(--accent)}
.upl input{position:absolute;width:1px;height:1px;opacity:0}
h4{margin:18px 0 8px;font-size:14px}
h4:first-child{margin-top:0}

.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.qlist li{display:flex;gap:9px;align-items:flex-start;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface-2)}
.qlist li.done{opacity:.55}
.qlist li.done span{text-decoration:line-through}
.topbar[hidden]{display:none}
.section{margin-bottom:18px}
.section h2{font-size:16px;margin:0 0 4px;color:var(--accent)}
tbody tr.static{cursor:default}
tbody tr.static:hover{background:none}
tr.grp td{background:var(--surface-2);font-weight:600;font-size:12.5px}
tr.bad td{background:var(--warn-soft)}
td select.inp{min-width:180px;margin-top:4px}
.wv-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-bottom:16px}
.stepc{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface);min-width:0}
.stepc.ok{border-color:var(--green)}
.stepc h4{margin:0 0 6px}
pre.csv{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px;overflow-x:auto;font:12px/1.55 var(--mono);margin:0}
.btn:disabled{opacity:.5;cursor:not-allowed}
.floor{display:grid;grid-template-columns:220px minmax(0,1fr) 340px;gap:14px;align-items:start}
.floor.cnc{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:1180px){.floor{grid-template-columns:minmax(0,1fr) 320px}.floor .sheets{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}}
@media (max-width:760px){.floor,.floor.cnc{grid-template-columns:minmax(0,1fr)}}
.sheets{display:flex;flex-direction:column;gap:6px}
.sheetbtn{display:flex;flex-direction:column;gap:1px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;cursor:pointer;font-size:12.5px;min-width:150px}
.sheetbtn b{font-size:14px}
.sheetbtn[aria-current="true"]{border:2px solid var(--accent)}
.sheetbtn.done{background:var(--green-soft);border-color:var(--green)}
.layout svg{display:block;width:100%;height:auto;max-width:100%}
.scan{background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:14px;margin-bottom:12px}
.scaninp{font:500 18px var(--mono);padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;width:100%;min-width:0;background:var(--surface);text-transform:uppercase}
.scaninp:focus{outline:2px solid var(--green);outline-offset:1px}
.fb{border-radius:10px;padding:14px 16px;margin-bottom:12px;display:flex;flex-direction:column;gap:3px;border:1px solid}
.fb b{font-size:17px}
.fb.ok{background:var(--green-soft);border-color:var(--green);color:var(--green-strong)}
.fb.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.fb.info{background:var(--info-soft);border-color:var(--info);color:var(--info)}
.fb span{color:var(--ink);font-size:13.5px}
table.qt{min-width:0;width:100%}
.qt td,.qt th{white-space:normal;vertical-align:top}
.qt td.num,.qt th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.qt tfoot td{border-bottom:0;padding-block:5px}
.qt tfoot tr:first-child td{border-top:1px solid var(--line-strong);padding-top:10px}
.qt tr.tot td{font-weight:700;font-size:15px;color:var(--accent)}
.qt tbody tr{cursor:default}
.qt tbody tr:hover{background:none}
.cabs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cab{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.cab.done{border-color:var(--green);background:var(--green-soft)}
.plist{list-style:none;margin:0;padding:0;font-size:12.5px;display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.plist li::before{content:"○ ";color:var(--line-strong)}
.plist li.ok{color:var(--ink)}
.plist li.ok::before{content:"✓ ";color:var(--green-strong);font-weight:700}
.wk{display:grid;grid-template-columns:160px repeat(5,minmax(110px,1fr));grid-template-rows:auto repeat(2,86px);min-width:720px;gap:0}
.wk-h{padding:8px 10px;font-size:12px;font-weight:600;color:var(--muted);background:var(--surface-2);border-bottom:1px solid var(--line)}
.wk-t{grid-column:1;padding:10px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.wk-c{border-bottom:1px solid var(--line);border-right:1px solid var(--line)}
.wk-b{margin:6px;border-radius:6px;padding:7px 9px;text-align:left;display:flex;flex-direction:column;gap:2px;font-size:12.5px;background:var(--accent);color:var(--accent-ink);border:0;cursor:pointer;z-index:1;min-width:0}
.wk-b span{opacity:.85;font-size:11.5px}
.wk-b.demo{background:var(--surface-2);color:var(--muted);border:1px dashed var(--line-strong);cursor:default}
.wk-b.signed{background:var(--green-strong);color:var(--on-green)}
.qlist small{display:block;color:var(--muted);font-size:11.5px}
.addq{display:flex;gap:8px;margin-top:8px}
.addq input{flex:1;min-width:0}

.box{border:1px solid var(--line);border-radius:8px;padding:12px 14px;background:var(--surface-2);margin-bottom:14px}
.path{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.path code{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);padding:4px 8px;border-radius:5px;word-break:break-all}
dl.sum{display:grid;grid-template-columns:minmax(120px,190px) minmax(0,1fr);gap:4px 14px;margin:0}
dl.sum dt{color:var(--muted)}
dl.sum dd{margin:0}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px 28px}
@media (max-width:560px){.sumgrid{grid-template-columns:minmax(0,1fr)}}

.chatter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.chatter h3{margin:0 0 10px;font-size:14px}
.chatter textarea{width:100%;border:1px solid var(--line-strong);border-radius:6px;padding:7px 9px;min-height:56px;resize:vertical;background:var(--surface)}
.msgs{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.msg{display:grid;grid-template-columns:28px minmax(0,1fr);gap:9px}
.msg .av{width:28px;height:28px;font-size:11px}
.msg .who{font-weight:600;font-size:13px}
.msg .who small{font-weight:400;color:var(--muted);margin-left:6px}
.msg p{margin:2px 0 0;font-size:13px}
.msg.log p{color:var(--muted)}

/* list */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:780px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.num{font-variant-numeric:tabular-nums}
.empty{padding:30px;text-align:center;color:var(--muted)}

.modal-bg{position:fixed;inset:0;background:var(--scrim);z-index:40;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:12px;max-width:560px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal header,.modal footer{padding:14px 18px;border-bottom:1px solid var(--line)}
.modal footer{border-bottom:0;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.modal header h2{margin:0;font-size:17px}
.modal .body{padding:14px 18px}
.miss{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.miss b{color:var(--ink);font-weight:600}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return (n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function ref(p){return 'PRJ-2026-'+String(p.id).padStart(4,'0')}
function P(){return projects.find(p=>p.id===S.cur)}
function filled(v){if(v==null)return false;if(Array.isArray(v))return v.length>0;if(typeof v==='object')return Object.values(v).some(x=>String(x??'').trim()!=='');return String(v).trim()!==''}
function visSections(p){return SECTIONS.filter(s=>!s.showIf||s.showIf(p.a))}
function visFields(p,s){return s.fields.filter(f=>!f.showIf||f.showIf(p.a))}
function secStats(p,s){const f=visFields(p,s);return{tot:f.length,done:f.filter(x=>filled(p.a[x.id])).length}}
function stats(p){let tot=0,done=0;visSections(p).forEach(s=>{const r=secStats(p,s);tot+=r.tot;done+=r.done});return{tot,done,pct:tot?Math.round(done/tot*100):0}}
function openQ(p){return p.q.filter(q=>!q.done)}
function fieldById(id){for(const s of SECTIONS)for(const f of s.fields)if(f.id===id)return f}
function fmt(v){if(Array.isArray(v))return v.join(', ');if(v&&typeof v==='object')return ['b','h','d'].map(k=>v[k]||'?').join(' × ')+' mm';return v}
function fmtDate(d){if(!d)return '—';const [y,m,dd]=d.split('-');return dd+'/'+m+'/'+y}

function vKanban(){
 const cols=STAGES.map(st=>{
  const ps=projects.filter(p=>p.stage===st);
  return `<section class="col" aria-label="${st}"><h3>${st}<span class="n">${ps.length}</span></h3><div class="cards">${ps.map(card).join('')}</div></section>`;
 }).join('');
 return cp('<span>Pijplijn</span>',`<button class="btn primary" data-act="new">+ Nieuw project</button>`)+`<main class="gut"><div class="kanban">${cols}</div></main>`;

function card(p){

 return `<button class="card" data-act="open" data-id="${p.id}">

function field(p,f){
 const v=p.a[f.id],id='f-'+f.id,flag=p.q.some(q=>q.field===f.id&&!q.done);

 }else if(f.type==='select'){

 }else if(f.type==='dims'){

 }else if(f.type==='textarea'){

 return `<div class="field ${filled(v)?'is-filled':''}">${lab}<div class="ctl">${c}<button class="flag ${flag?'on':''}" data-act="flag" data-f="${f.id}" aria-pressed="${flag}" title="Nog te bevestigen door klant" aria-label="${esc(f.label)}: markeer als vraag voor de klant">?</button></div></div>`;

/* ---------- work preparation ---------- */
const SHEET_M2=2.8*2.07,YIELD=0.82;
function matBy(code){return MATS.find(m=>m.code===code)||EDGES.find(m=>m.code===code)}
function isEdge(m){return EDGES.includes(m)}
function unit(m,n){return isEdge(m)?n+' m':n+(n===1?' plaat':' platen')}
function avail(m){return m.onHand-m.reserved}
function wvProjects(){return projects.filter(p=>p.stage==='Werkvoorbereiding')}
function exported(){return S.batch.status==='Geëxporteerd'}
function batchProjects(){return exported()?projects.filter(p=>S.batch.ids.includes(p.id)):wvProjects().filter(p=>!S.unsel.has(p.id))}
function partsOf(p){
 return (PARTS[p.id]||[]).map((r,i)=>{const [name,cab,mat,l,w,t,qty,grain,eb,cnc]=r,[ec,sides]=(eb||':').split(':'),n=String(i+1).padStart(3,'0');
  return {pid:ref(p)+'-'+n,p,name,cab,mat,code:MAP[mat]||'',l,w,t,qty,grain:!!grain,eb:{L1:sides.includes('L1')?ec:'',L2:sides.includes('L2')?ec:'',B1:sides.includes('B1')?ec:'',B2:sides.includes('B2')?ec:''},cnc:cnc?ref(p)+'_'+n+'.tsw':''}});
}
function needs(parts){
 const pl={},ed={};
 parts.forEach(pt=>{if(!pt.code)return;pl[pt.code]=(pl[pt.code]||0)+pt.l*pt.w*pt.qty/1e6;
  Object.entries(pt.eb).forEach(([s,c])=>{if(c)ed[c]=(ed[c]||0)+(s[0]==='L'?pt.l:pt.w)*pt.qty/1000})});
 return {plates:Object.entries(pl).map(([code,area])=>({code,area,need:Math.ceil(area/(SHEET_M2*YIELD)),m:matBy(code)})),
  edges:Object.entries(ed).map(([code,len])=>({code,area:0,need:Math.ceil(len*1.1),m:matBy(code)}))};
}
function shortOf(x){return exported()||!x.m?0:Math.max(0,x.need-avail(x.m)-x.m.incoming)}
function stockPill(x){
 if(exported())return '<span class="badge info">Gereserveerd</span>';
 const a=avail(x.m);
 if(x.need<=a)return '<span class="badge ok">Op voorraad</span>';
 if(x.need<=a+x.m.incoming)return '<span class="badge info">Besteld, dekt nood</span>';
 return `<span class="badge warn">Tekort ${unit(x.m,shortOf(x))}</span>`;
}
function ebTxt(eb){const g={};Object.entries(eb).forEach(([s,c])=>{if(c)(g[c]=g[c]||[]).push(s)});const k=Object.keys(g);return k.length?k.map(c=>c+': '+g[c].join(' ')).join('<br>'):'—'}
function csv(parts){
 return ['PartID;Project;Klant;Kast;Onderdeel;Materiaal;Lengte;Breedte;Dikte;Aantal;Nerf;Kant_L1;Kant_L2;Kant_B1;Kant_B2;CNC_programma',
  ...parts.map(pt=>[pt.pid,ref(pt.p),pt.p.customer,pt.cab,pt.name,pt.code||'??',pt.l,pt.w,pt.t,pt.qty,pt.grain?1:0,pt.eb.L1,pt.eb.L2,pt.eb.B1,pt.eb.B2,pt.cnc].join(';'))].join('\n');
}
function sumQty(parts){return parts.reduce((a,x)=>a+x.qty,0)}

function vWV(){
 const exp=exported(),bp=batchProjects(),parts=bp.flatMap(partsOf),errs=parts.filter(x=>!x.code),n=needs(parts),all=[...n.plates,...n.edges],short=all.filter(x=>shortOf(x)>0);
 const list=exp?projects.filter(p=>S.batch.ids.includes(p.id)):wvProjects();
 const rows=list.map(p=>{const pp=partsOf(p),sel=exp||!S.unsel.has(p.id);
  return `<tr class="static"><td><input type="checkbox" id="sel-${p.id}" data-act="selproj" data-id="${p.id}" ${sel?'checked':''} ${exp?'disabled':''} aria-label="${esc(p.name)} opnemen in zaagbatch"></td>

   <td class="num">${pp.length?pp.length+' lijnen · '+sumQty(pp)+' st.':'<span class="badge warn">Geen onderdelenlijst</span>'}</td><td class="num">${fmtDate(p.a.deadline)}</td>
   <td><span class="muted" style="font-size:12px">TopSolid-export · 19 nov 10:42</span> <button class="btn small" data-act="toast" data-v="In de echte module leest dit de onderdelenlijst opnieuw uit de TopSolid-exportmap.">Opnieuw inlezen</button></td></tr>`}).join('');
 const tabs=[['parts','Onderdelen',parts.length+(errs.length?' · '+errs.length+' fout':'')],['mat','Materiaal & voorraad',short.length?short.length+' tekort':'ok'],['ardis','Ardis-export',S.batch.status]]
  .map(([k,l,c])=>`<button role="tab" data-act="wvtab" data-v="${k}" aria-selected="${S.wvTab===k}">${l}<span class="c">${c}</span></button>`).join('');
 const body=S.wvTab==='mat'?wvMat(n,short):S.wvTab==='ardis'?wvArdis(parts,errs,short):wvParts(bp);
 return cp(`<span>Werkvoorbereiding</span> <span class="muted">/ zaagbatch <span class="mono">${S.batch.id}</span></span>`,
  `<span class="badge ${exp?'info':''}">${S.batch.status}</span>${short.length?`<button class="btn" data-act="orderprep" data-v="short">Bestellen voor tekorten</button>`:''}<button class="btn primary" data-act="wvtab" data-v="ardis">Naar Ardis-export</button>`)+
 `<main class="gut"><section class="section"><h2>Projecten klaar voor productie</h2><p class="hint">Goedgekeurd door de klant. Vink aan wat samen in één zaagbatch gaat: Ardis optimaliseert dan over de projecten heen.</p>

  <section class="sheet" style="padding:0 16px 16px"><div class="tabs" role="tablist">${tabs}</div><div class="panel">${body}</div></section></main>`;
}
function wvParts(bp){
 if(!bp.length)return '<p class="empty">Geen projecten geselecteerd.</p>';
 const opts=MATS.map(m=>`<option value="${m.code}">${m.code} · ${esc(m.name)}</option>`).join('');
 const rows=bp.map(p=>`<tr class="grp static"><td colspan="9">${ref(p)} · ${esc(p.name)}</td></tr>`+partsOf(p).map(pt=>`<tr class="static ${pt.code?'':'bad'}">

  <td class="mono num">${pt.l} × ${pt.w} × ${pt.t}</td><td class="num">${pt.qty}</td><td>${pt.grain?'Ja':'—'}</td><td class="mono" style="font-size:11.5px">${ebTxt(pt.eb)}</td><td class="mono" style="font-size:11.5px">${pt.cnc||'—'}</td></tr>`).join('')).join('');
 return `<p class="hint">Ingelezen uit de TopSolid-onderdelenlijst. Elk onderdeel krijgt een barcode; Ardis drukt die op het etiket en de CNC zoekt er het programma mee op.</p>

}
function wvMat(n,short){
 if(!n.plates.length)return '<p class="empty">Geen materiaal nodig: selecteer projecten of koppel materialen.</p>';
 const pr=n.plates.map(x=>`<tr class="static"><td class="mono">${x.code}</td><td>${esc(x.m.name)}</td><td class="num">${x.area.toFixed(1)} m²</td><td class="num"><b>${x.need}</b></td><td class="num">${x.m.onHand}</td><td class="num">${x.m.reserved}</td><td class="num">${avail(x.m)}</td><td class="num">${x.m.incoming||'—'}</td><td class="num">${OFFCUTS.filter(o=>o.code===x.code).length||'—'}</td><td>${stockPill(x)}</td></tr>`).join('');
 const er=n.edges.map(x=>`<tr class="static"><td class="mono">${x.code}</td><td>${esc(x.m.name)}</td><td class="num"><b>${x.need} m</b></td><td class="num">${x.m.onHand} m</td><td class="num">${x.m.reserved} m</td><td class="num">${avail(x.m)} m</td><td class="num">${x.m.incoming?x.m.incoming+' m':'—'}</td><td>${stockPill(x)}</td></tr>`).join('');
 return `<p class="hint">Platen nodig = oppervlakte ÷ plaat ${SHEET_M2.toFixed(2)} m² bij ${Math.round(YIELD*100)} % verwacht rendement. Ardis berekent het exacte aantal. Kantenband + 10 % snijverlies.</p>

}

 ${r?`<div class="box"><b>Resultaat ${r.id}</b> <span class="badge ${r.status==='Klaar om te zagen'?'ok':'warn'}">${r.status}</span><p class="hint" style="margin:6px 0 8px">Rendement ${r.yield} %, ${r.labels} etiketten met barcode, ${r.offUsed} ${r.offUsed===1?'rest':'resten'} hergebruikt, ${r.newOff.length} nieuwe resten op voorraad.</p>

 else if(S.stTab==='po')body=`<p class="hint">Bestelbonnen gaan per e-mail naar de leverancier. Bij levering boek je de ontvangst: de voorraad stijgt en wachtende zaagbatches kunnen verder.</p><div class="tablewrap"><table><thead><tr><th>Bestelling</th><th>Leverancier</th><th>Lijnen</th><th>Besteld op</th><th>Verwacht</th><th>Status</th><th></th></tr></thead>
  <tbody>${POS.map(po=>`<tr class="static"><td class="mono">${po.id}</td><td>${esc(po.sup)}</td><td>${po.lines.map(l=>`<span class="mono">${l.code}</span> × ${unit(matBy(l.code),l.qty)}`).join('<br>')}</td><td>${po.date}</td><td>${po.exp}</td>
  <td><span class="badge ${po.status==='Ontvangen'?'ok':'info'}">${po.status}</span></td><td>${po.status==='Besteld'?`<button class="btn small primary" data-act="receive" data-id="${po.id}">Ontvangst boeken</button>`:''}</td></tr>`).join('')}</tbody></table></div>`;
 else if(S.stTab==='moves')body=`<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Referentie</th><th>Omschrijving</th><th>Hoeveelheid</th></tr></thead><tbody>${MOVES.map(m=>`<tr class="static"><td>${m.d}</td><td class="mono">${m.ref}</td><td>${esc(m.desc)}</td><td class="num">${m.q}</td></tr>`).join('')}</tbody></table></div>`;
 else body=`<div class="tablewrap"><table><thead><tr><th>Code</th><th>Plaat</th><th>Formaat</th><th>Voorraad</th><th>Gereserveerd</th><th>Beschikbaar</th><th>Besteld</th><th>Minimum</th><th>Leverancier</th><th>Status</th><th></th></tr></thead><tbody>${MATS.map(mrow).join('')}</tbody></table></div>`;
 return cp('<span>Voorraad</span> <span class="muted">/ plaatmateriaal en kantenband</span>',`<button class="btn" data-act="newmat">+ Nieuw materiaal</button>`+(low.length?`<button class="btn primary" data-act="orderprep" data-v="min">Bijbestellen onder minimum (${low.length})</button>`:''))+

function openOrder(kind,code){
 let lines=[];
 if(kind==='short'){const n=needs(batchProjects().flatMap(partsOf));[...n.plates,...n.edges].forEach(x=>{const s=shortOf(x);if(s>0)lines.push({code:x.code,qty:isEdge(x.m)?Math.ceil(s/50)*50:s})})}
 else if(kind==='min'){[...MATS,...EDGES].forEach(m=>{const gap=m.min-avail(m)-m.incoming;if(gap>0)lines.push({code:m.code,qty:isEdge(m)?Math.ceil((gap+m.min)/50)*50:gap+Math.ceil(m.min/2)})})}

/* ---------- shop floor ---------- */
function pieces(p){return partsOf(p).flatMap(pt=>Array.from({length:pt.qty},(_,k)=>Object.assign({},pt,{piece:pt.pid+'.'+(k+1)})))}
function allPieces(){return projects.filter(p=>PARTS[p.id]).flatMap(pieces)}
function st(pc){return DONE[pc.piece]||(DONE[pc.piece]={saw:false,cnc:false})}
function openBatches(){return BATCHES.filter(b=>b.ids&&['Klaar om te zagen','Wacht op levering','In productie'].includes(b.status))}
function plans(b){
 const L=2800,W=2070,T=10,K=4,out=[],by={};
 projects.filter(p=>b.ids.includes(p.id)).flatMap(pieces).filter(x=>x.code).forEach(x=>(by[x.code]=by[x.code]||[]).push(x));
 Object.entries(by).forEach(([code,arr])=>{
  arr.sort((a,c)=>c.w-a.w||c.l-a.l);let sh,x,y,h;
  const nw=()=>{sh={code,parts:[]};out.push(sh);x=T;y=T;h=0};nw();
  arr.forEach(pc=>{if(x+pc.l>L-T){x=T;y+=h+K;h=0}if(y+pc.w>W-T)nw();sh.parts.push({pc,x,y});x+=pc.l+K;h=Math.max(h,pc.w)});
 });
 return out;
}
function sheetSvg(sh){
 return `<svg viewBox="0 0 2800 2070" role="img" aria-label="Zaagplan ${sh.code}"><rect width="2800" height="2070" fill="var(--surface-2)" stroke="var(--line-strong)" stroke-width="8"/>
 ${sh.parts.map(({pc,x,y})=>{const d=st(pc).saw,fs=Math.min(90,pc.w/3.2,pc.l/7);
  return `<g data-act="scanpiece" data-v="${pc.piece}" style="cursor:pointer"><rect x="${x}" y="${y}" width="${pc.l}" height="${pc.w}" fill="${d?'var(--green-soft)':'var(--surface)'}" stroke="${d?'var(--green-strong)':'var(--ink)'}" stroke-width="6"/>
  <text x="${x+pc.l/2}" y="${y+pc.w/2}" font-size="${fs}" font-family="var(--mono)" fill="var(--ink)" text-anchor="middle" dominant-baseline="central">${pc.piece.slice(-5)}</text></g>`}).join('')}</svg>`;
}
function scanBox(){
 const m=S.sf.msg;
 return `<form class="scan" data-scan><label for="scan"><b>Scan barcode</b></label><div class="row" style="margin-top:6px;flex-wrap:nowrap"><input id="scan" class="scaninp" autocomplete="off" spellcheck="false" placeholder="Etiket scannen"><button class="btn primary">OK</button></div>
  <div class="row" style="margin-top:8px"><button type="button" class="btn small" data-act="simscan">Scan volgend etiket (demo)</button><span class="hint" style="margin:0">${S.sf.station==='saw'?'Of klik een onderdeel op het zaagplan.':'Of klik een lijn in de wachtrij.'}</span></div></form>
  ${m?`<div class="fb ${m.kind}" role="status"><b>${esc(m.title)}</b>${m.sub?`<span>${esc(m.sub)}</span>`:''}</div>`:''}`;
}
function vFloor(){
 const s=S.sf.station;
 return cp(`<span>Werkvloer</span> <span class="muted">/ ${s==='saw'?'Paneelzaag':'CNC'}</span>`,
  `<div class="chips" role="group" aria-label="Werkpost"><button class="chip" data-act="station" data-v="saw" aria-pressed="${s==='saw'}">Paneelzaag</button><button class="chip" data-act="station" data-v="cnc" aria-pressed="${s==='cnc'}">CNC</button></div>`)
  +`<main class="gut">${s==='saw'?vSaw():vCnc()}</main>`;
}
function vSaw(){
 const bs=openBatches();
 if(!bs.length)return `<div class="floor"><div class="pcard">Geen zaagbatches klaar. Exporteer een batch naar Ardis en lees het resultaat in.</div>${scanBox()}</div>`;
 const b=bs.find(x=>x.id===S.sf.batch)||bs[0];S.sf.batch=b.id;
 const pl=plans(b);if(S.sf.sheet>=pl.length)S.sf.sheet=0;const sh=pl[S.sf.sheet];
 const bsel=bs.map(x=>`<button class="chip" data-act="sfbatch" data-v="${x.id}" aria-pressed="${x.id===b.id}">${x.id}</button>`).join('');
 const list=pl.map((p,i)=>{const d=p.parts.filter(q=>st(q.pc).saw).length;return `<button class="sheetbtn ${d===p.parts.length?'done':''}" data-act="sheet" data-v="${i}" aria-current="${i===S.sf.sheet}"><b>Plaat ${i+1}/${pl.length}</b><span class="mono">${p.code}</span><span>${d}/${p.parts.length} gezaagd</span></button>`}).join('');
 const rows=sh.parts.map(({pc})=>{const d=st(pc).saw;return `<tr class="static"><td class="mono">${pc.piece}</td><td>${esc(pc.name)}<div class="muted" style="font-size:12px">${esc(pc.p.name)} · ${esc(pc.cab)}</div></td><td class="mono num">${pc.l} × ${pc.w}</td><td>${d?'<span class="badge ok">Gezaagd</span>':'<span class="badge">Open</span>'}</td><td>${pc.cnc?'CNC':'Montage'}</td></tr>`}).join('');
 return `${b.status==='Wacht op levering'?'<div class="intake" style="background:var(--warn-soft);border-color:var(--warn)"><p><b>Deze batch wacht op materiaal.</b> Zaag enkel platen die al geleverd zijn.</p></div>':''}
 <div class="row" style="margin-bottom:12px"><span class="muted">Zaagbatch</span>${bsel}</div>
 <div class="floor"><div class="sheets">${list}</div>
  <div class="pcard layout" style="margin:0"><div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Plaat ${S.sf.sheet+1} · <span class="mono">${sh.code}</span></b><span class="hint" style="margin:0">2800 × 2070 mm · zaagplan uit Ardis</span></div>${sheetSvg(sh)}
   <div class="tablewrap" style="margin-top:12px"><table style="min-width:560px"><thead><tr><th>Etiket</th><th>Onderdeel</th><th>Maat</th><th>Status</th><th>Volgende</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div>${scanBox()}</div></div>`;
}
function cncOps(pc){const n=pc.name.toLowerCase();return n.includes('zijwand')?'Boorpatroon plankdragers en scharnierplaten, groef voor rug':n.includes('front')||n.includes('deur')?'Scharnierpotten Ø 35 mm, greepuitfrezing':n.includes('bodem')||n.includes('top')?'Deuvel- en excenterboringen':n.includes('wandpaneel')||n.includes('afdek')?'Contour frezen, boringen bevestiging':'Contour frezen'}
function vCnc(){
 const q=allPieces().filter(pc=>pc.cnc&&st(pc).saw&&!st(pc).cnc);
 const doneToday=allPieces().filter(pc=>pc.cnc&&st(pc).cnc).length;
 const cur=S.sf.cnc&&allPieces().find(pc=>pc.piece===S.sf.cnc);
 const card=cur?`<div class="pcard" style="border:2px solid var(--green-strong)"><div class="ref">${cur.piece}</div><h2 style="margin:2px 0 6px">${esc(cur.name)}</h2>
  <p class="hint" style="margin:0 0 10px">${esc(cur.p.name)} · ${esc(cur.cab)} · <span class="mono">${cur.l} × ${cur.w} × ${cur.t}</span> · ${esc(cur.code)}</p>
  <dl class="sum"><dt>Programma</dt><dd class="mono">${cur.cnc}</dd><dt>Bron</dt><dd>TopSolid CNC-plugin</dd><dt>Bewerkingen</dt><dd>${cncOps(cur)}</dd><dt>Kantenband</dt><dd class="mono" style="font-size:12px">${ebTxt(cur.eb)}</dd></dl>
  <div class="row" style="margin-top:14px">${S.sf.run?'<span class="badge info">Bewerking loopt</span><button class="btn go" style="width:auto" data-act="cncdone">Bewerking klaar</button>':'<button class="btn primary" data-act="cncstart">Programma starten</button><button class="btn" data-act="cncclear">Annuleren</button>'}</div></div>`
  :`<div class="pcard"><h2>Geen onderdeel geladen</h2><p class="hint" style="margin:0">Scan het etiket op een gezaagd onderdeel. Het juiste programma uit TopSolid wordt dan geladen.</p></div>`;
 const rows=q.map(pc=>`<tr data-act="scanpiece" data-v="${pc.piece}"><td class="mono">${pc.piece}</td><td>${esc(pc.name)}<div class="muted" style="font-size:12px">${esc(pc.p.name)}</div></td><td class="mono" style="font-size:12px">${pc.cnc}</td></tr>`).join('');
 return `<div class="floor cnc"><div>${scanBox()}${card}</div>
  <div class="pcard" style="margin:0"><h2>Wachtrij CNC</h2><p class="hint">${q.length} gezaagde onderdelen wachten · ${doneToday} klaar</p>
  <div class="tablewrap"><table style="min-width:420px"><thead><tr><th>Etiket</th><th>Onderdeel</th><th>Programma</th></tr></thead><tbody>${rows||'<tr class="static"><td colspan="3" class="empty">Niets in de wachtrij.</td></tr>'}</tbody></table></div></div></div>`;
}
function checkProgress(p){
 const pcs=pieces(p).filter(x=>x.code);if(!pcs.length)return;
 if(p.stage==='Zagen'&&pcs.every(x=>st(x).saw)){p.stage='CNC';log(p,'Alle onderdelen gezaagd. Project staat nu in CNC.');toast(p.name+': alles gezaagd, door naar CNC.')}
 if(p.stage==='CNC'&&pcs.every(x=>st(x).saw)&&pcs.filter(x=>x.cnc).every(x=>st(x).cnc)){p.stage='Montage & plaatsing';log(p,'Alle CNC-bewerkingen klaar. Project staat nu in Montage & plaatsing.');toast(p.name+': klaar voor montage.')}
 BATCHES.forEach(b=>{if(b.ids&&b.ids.includes(p.id)&&b.status!=='Gezaagd'&&projects.filter(x=>b.ids.includes(x.id)).flatMap(pieces).filter(x=>x.code).every(x=>st(x).saw)){b.status='Gezaagd'}
  else if(b.ids&&b.ids.includes(p.id)&&b.status==='Klaar om te zagen'&&pcs.some(x=>st(x).saw))b.status='In productie'});
}
function doScan(code){
 code=(code||'').trim().toUpperCase();if(!code)return;
 const s=S.sf.station,pc=allPieces().find(x=>x.piece===code),off=OFFCUTS.find(o=>o.id===code);
 if(off){S.sf.msg={kind:'info',title:'Rest '+off.id+' ('+off.code+', '+off.l+' × '+off.w+')',sub:'Gebruikt in deze batch: afgeboekt van voorraad.'};OFFCUTS.splice(OFFCUTS.indexOf(off),1);MOVES.unshift({d:new Date().toLocaleDateString('nl-BE',{day:'numeric',month:'short'}),ref:off.id,desc:'Rest verbruikt aan de zaag',q:'−1 rest'});return}
 if(!pc){S.sf.msg={kind:'warn',title:'Onbekende barcode: '+code,sub:'Controleer het etiket of scan opnieuw.'};return}
 const d=st(pc);
 if(s==='saw'){
  const b=openBatches().find(x=>x.ids.includes(pc.p.id));
  if(!b){S.sf.msg={kind:'warn',title:pc.piece+' zit in geen open zaagbatch',sub:pc.p.name+' staat in '+pc.p.stage+'.'};return}
  if(d.saw){S.sf.msg={kind:'warn',title:'Al gezaagd: '+pc.name,sub:pc.piece};return}
  d.saw=true;S.sf.batch=b.id;const pl=plans(b),i=pl.findIndex(x=>x.parts.some(q=>q.pc.piece===pc.piece));if(i>=0)S.sf.sheet=i;
  S.sf.msg={kind:'ok',title:'Gezaagd: '+pc.name,sub:pc.p.name+' · '+pc.cab+' · '+pc.l+' × '+pc.w+' mm. Volgende stap: '+(pc.cnc?'CNC':'rechtstreeks naar montage')+'.'};
  checkProgress(pc.p);return;
 }
 if(!d.saw){S.sf.msg={kind:'warn',title:'Nog niet gezaagd: '+pc.name,sub:'Dit onderdeel moet eerst langs de paneelzaag.'};return}
 if(!pc.cnc){S.sf.msg={kind:'info',title:'Geen CNC-bewerking: '+pc.name,sub:'Rechtstreeks naar montage.'};return}
 if(d.cnc){S.sf.msg={kind:'warn',title:'Al bewerkt: '+pc.name,sub:pc.cnc};return}
 S.sf.cnc=pc.piece;S.sf.run=false;S.sf.msg={kind:'ok',title:'Programma geladen: '+pc.cnc,sub:pc.name+' · '+pc.p.name};
}

/* ---------- quotes from TopSolid material lists ---------- */
function eur(n){return (Math.round(n*100)/100).toLocaleString('nl-BE',{style:'currency',currency:'EUR'})}
function qs(p){return p.qs||(p.qs={margin:35,ext:10,vat:p.a.situatie==='Nieuwbouw'?21:6,korting:0,days:p.a.type==='Keuken'?3:p.a.type==='Dressing'?2:1,
 werkblad:(p.a.werkblad||'').includes('extern')?2400:0,toestellen:p.a.type==='Keuken'&&p.a.toestelLev==='Via ons'?4800:0,voorschot:30})}
function hwPrice(k){const r=HW_PRICE.find(([n])=>k.startsWith(n));return r?r[1]:0}
function calcQuote(p){
 const s=qs(p),parts=partsOf(p),perM2=c=>PLATE_PRICE[c]/(SHEET_M2*YIELD),cab={},miss=new Set();
 let mat=0,lak=0,edge=0,mach=0,machMin=0,lakM2=0,edgeM=0,asm=0,asmH=0;
 parts.forEach(pt=>{const area=pt.l*pt.w*pt.qty/1e6;let c=0;

  if(/deur|klep|front kolom|front boven/.test(n)){add('Scharnier softclose 110°',(pt.l>1800?4:pt.l>900?3:2)*pt.qty);if(grip)add(grip,pt.qty)}
  if(n.includes('front lade')){add('Ladeset '+(p.a.lades||'standaard').toLowerCase(),pt.qty);if(grip)add(grip,pt.qty)}
  if(n.includes('legplank'))add('Plankdrager 5 mm',4*pt.qty);

/* ---------- state changes ---------- */
function now(){const d=new Date();return d.toLocaleDateString('nl-BE',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('nl-BE',{hour:'2-digit',minute:'2-digit'})}
function log(p,msg,who){p.chatter.unshift({who:who||'Systeem',t:now(),msg,log:!who})}
function autoClose(p,fid){if(filled(p.a[fid]))p.q.forEach(q=>{if(q.field===fid)q.done=true})}
function setA(p,fid,v){p.a[fid]=v;autoClose(p,fid)}
function refreshMeters(p){
 const m=document.getElementById('meter');if(m)m.innerHTML=meter(p);
 visSections(p).forEach(s=>{const el=document.getElementById('tc-'+s.id);if(el){const r=secStats(p,s);el.textContent=r.done+'/'+r.tot;el.classList.toggle('full',r.done===r.tot)}});
 const q=document.getElementById('sm-q');if(q)q.textContent=openQ(p).length;
}
function toast(msg){const o=document.createElement('div');o.className='toast';o.setAttribute('role','status');o.textContent=msg;document.body.appendChild(o);setTimeout(()=>o.remove(),3200)}

function openHandoff(){
 const p=P(),secs=visSections(p);
 const miss=secs.map(s=>{const m=visFields(p,s).filter(f=>!filled(p.a[f.id]));return m.length?`<li><b>${s.title}:</b> ${m.map(f=>esc(f.label)).join(', ')}</li>`:''}).join('');
 const n=secs.reduce((a,s)=>a+visFields(p,s).filter(f=>!filled(p.a[f.id])).length,0);
 document.getElementById('overlay').innerHTML=`<div class="modal-bg" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mh">

   <p style="margin:12px 0 4px">${n?`<b>${n} intakevragen</b> zijn nog leeg. Dat is geen probleem: de tekenaar kan al starten.`:'Alle intakevragen zijn ingevuld.'}</p>
   ${n?`<ul class="miss">${miss}</ul><label style="display:flex;gap:8px;margin-top:12px;align-items:flex-start"><input type="checkbox" id="m-addq" checked> Lege vragen toevoegen als open vragen voor de tekenaar</label>`:''}
  </div>
  <footer><button class="btn" data-act="close">Annuleren</button><button class="btn primary" data-act="dohandoff">Doorsturen</button></footer></div></div>`;

}
function closeModal(){document.getElementById('overlay').innerHTML=''}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
 const svgEl=e.target.closest('svg[data-pin]');
 if(svgEl&&S.view==='portal'){
  const pp=portalProject(),ver=pp.versions[pp.versions.length-1];
  if(e.target.closest('.pin')||!ver||ver.status!=='Ter goedkeuring')return;
  const pt=svgEl.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const loc=pt.matrixTransform(svgEl.getScreenCTM().inverse());
  const r={id:Date.now(),view:svgEl.dataset.pin,x:Math.round(loc.x),y:Math.round(loc.y),text:''};
  pp.remarks.push(r);S.decision='chg';S.err={};render();document.getElementById('rm-'+r.id)?.focus();return;
 }
 const el=e.target.closest('[data-act]');if(!el)return;
 const act=el.dataset.act,p=P();
 if(act==='close'){if(e.target===el||el.tagName==='BUTTON')closeModal();return}
 if(act==='qdone'){const q=p.q.find(x=>x.id==el.dataset.id);q.done=el.checked;render();return}
 switch(act){
  case 'nav':S.view=el.dataset.v;if(S.view==='form'&&!P())S.cur=projects[0].id;break;
  case 'open':S.cur=+el.dataset.id;S.view='form';S.tab=el.dataset.tab||(projects.find(x=>x.id===S.cur).stage==='Intake'?'algemeen':'overzicht');window.scrollTo(0,0);break;
  case 'new':{const np=proj({id:seq++,name:'Nieuw project',customer:'',city:'',stage:'Intake',rep:SALES[0]});log(np,'Project aangemaakt door '+SALES[0]+'.');projects.unshift(np);S.cur=np.id;S.view='form';S.tab='algemeen';render();const t=document.getElementById('p-name');t.focus();t.select();return}
  case 'tab':S.tab=el.dataset.v;break;
  case 'stage':if(p.stage!==el.dataset.v){log(p,'Fase gewijzigd: '+p.stage+' → '+el.dataset.v+'.');p.stage=el.dataset.v}break;
  case 'chip':{const f=el.dataset.f,v=el.dataset.v;setA(p,f,p.a[f]===v?'':v);break}
  case 'multi':{const f=el.dataset.f,v=el.dataset.v,cur=p.a[f]||[];setA(p,f,cur.includes(v)?cur.filter(x=>x!==v):[...cur,v]);break}
  case 'flag':{const f=el.dataset.f,ex=p.q.find(q=>q.field===f&&!q.done);if(ex)p.q=p.q.filter(q=>q!==ex);else p.q.push({id:Date.now(),text:fieldById(f).label+': te bevestigen door klant',field:f,done:false,toCustomer:true});break}

   if(cust)log(p,'Vraag in klantportaal gezet: '+i.value.trim());toast(cust?'Vraag staat in het klantportaal. De klant krijgt een melding.':'Interne vraag toegevoegd.');break}

document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.nm&&S.nm){S.nm[el.dataset.nm]=el.value;return}

 if(el.id==='pt-name'){S.sigName=el.value;return}
 if(el.id==='ins-name'){S.mp.name=el.value;return}
 if(el.id==='ins-chk'){S.mp.chk=el.checked;return}
 if(el.id==='pt-general'){S.general=el.value;return}
 if(el.id==='pt-chk'){S.sigChk=el.checked;return}
 const p=P();if(!p)return;
 if(el.dataset.f&&el.tagName!=='SELECT'){
  const f=el.dataset.f;
  if(el.dataset.k){const d=Object.assign({},p.a[f]||{});d[el.dataset.k]=el.value;setA(p,f,d)}else setA(p,f,el.value);
  el.closest('.field').classList.toggle('is-filled',filled(p.a[f]));refreshMeters(p);
 }else if(el.dataset.p&&el.tagName!=='SELECT'){p[el.dataset.p]=el.value;el.closest('.field')?.classList.toggle('is-filled',!!el.value)}
 else if(el.dataset.cap){const arr=p[el.dataset.cap][+el.dataset.i];arr.cap=el.value}
 else if(el.id==='notes'){p.notes=el.value}
});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.nm){S.nm[el.dataset.nm]=el.value;return}
 if(el.dataset.qs){const pp=P(),v=+String(el.value).replace(',','.');qs(pp)[el.dataset.qs]=isFinite(v)&&v>=0?v:0;render();return}
 if(el.dataset.map!==undefined){if(el.value==='__new'){el.value='';openNewMat(el.dataset.map);return}if(el.value){MAP[el.dataset.map]=el.value;render();toast('Gekoppeld: '+el.dataset.map+' → '+el.value+'. Geldt voortaan voor alle projecten.')}return}

  });log(p,el.files.length+(kind==='plans'?' plan(nen)':kind==='instPhotos'?' foto(’s) van de plaatsing':' foto(’s)')+' toegevoegd.');render()}
});
document.addEventListener('submit',e=>{

{const pm=projects.find(x=>x.id===150);pm.quotes=[{id:'OF-2026-0141',v:1,status:'Vervangen',created:'4 nov 2026',calc:calcQuote(pm)},{id:'OF-2026-0148',v:2,status:'Verstuurd',created:'17 nov 2026',calc:calcQuote(pm)}];
